<mat-card class="table-card">
    <mat-card-header>
        <mat-card-title>Transactions List</mat-card-title>
        <div class="spacer"></div>
        <mat-form-field>
            <mat-label>Filter by Category</mat-label>
            <mat-select [(ngModel)]="selectedValue" (selectionChange)="applyTableFilter()">
                <mat-option *ngFor="let option of filterOptions" [value]="option">
                    {{ option }}
                </mat-option>
            </mat-select>
        </mat-form-field>
    </mat-card-header>
    <mat-card-content class="table-card-content">
        <table mat-table [dataSource]="jsonData">
            <!-- Date Column -->
            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef>Date</th>
                <td mat-cell *matCellDef="let element">{{element.date | toDate}}</td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let element">{{element.merchantName}}</td>
            </ng-container>

            <!-- Category Column -->
            <ng-container matColumnDef="category">
                <th mat-header-cell *matHeaderCellDef>Category</th>
                <td mat-cell *matCellDef="let element">{{element.category}}</td>
            </ng-container>

            <!-- Amount Column -->
            <ng-container matColumnDef="amount">
                <th mat-header-cell *matHeaderCellDef>Amount</th>
                <td mat-cell *matCellDef="let element">{{element.amount | formatPriceAmount }}</td>
            </ng-container>

            <!-- Amount Column -->
            <ng-container matColumnDef="included">
                <th mat-header-cell *matHeaderCellDef>Include</th>
                <td mat-cell *matCellDef="let element; let i = index">
                    <input type="checkbox" [(ngModel)]="element.includeInCalc" (change)="changeValue()" />
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
    </mat-card-content>
</mat-card>
