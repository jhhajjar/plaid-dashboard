<div class="main-body-container">
    <div class="side-panel-container">
        <h2>Filters</h2>

        <h3 class="dropdown-label">Start Date</h3>
        <div class="mat-form-field-container">
            <mat-form-field class="month-dropdown">
                <mat-label>Month</mat-label>
                <mat-select [(ngModel)]="startMonth" (selectionChange)="setEndDate()">
                    <mat-option *ngFor="let option of months" [value]="option.id">
                    {{ option.name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field class="year-dropdown">
                <mat-label>Year</mat-label>
                <mat-select [(ngModel)]="startYear" (selectionChange)="setEndDate()">
                    <mat-option *ngFor="let option of years" [value]="option.id">
                    {{ option.name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>


        <h3 class="dropdown-label">End Date</h3>
        <div class="mat-form-field-container">
            <mat-form-field class="month-dropdown">
                <mat-label>Month</mat-label>
                <mat-select [(ngModel)]="endMonth" (selectionChange)="setStartDate()">
                    <mat-option *ngFor="let option of months" [value]="option.id">
                    {{ option.name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field class="year-dropdown">
                <mat-label>Year</mat-label>
                <mat-select [(ngModel)]="endYear" (selectionChange)="setStartDate()">
                    <mat-option *ngFor="let option of years" [value]="option.id">
                    {{ option.name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <button mat-button mat-raised-button (click)="applyFilters()">Apply</button>
    </div>
    <div class="main-figures">
        <app-networth class="networth" [data]="this.transactions"></app-networth>
        <app-categories class="categories" [data]="this.transactions"></app-categories>
        <app-table class="table" [data]="this.allTransactions"
        (transactionsChange)="updateVariables($event)"></app-table>
    </div>
    <div>
    </div>
</div>
